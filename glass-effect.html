<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080809">
  <title>Glass Depth — Effect Study · NWA</title>
  <link rel="stylesheet" href="fonts/nwa-fonts.css">
  <style>
    :root {
      --obsidian: #080809;
      --champagne: #C5A059;
      --champagne-light: #E2CFA0;
      --champagne-deep: #A8853F;
      --champagne-rgb: 197, 160, 89;
      --bone: #EDE9E3;
      --ink-secondary: #6A6A72;
      --serif: 'EB Garamond', Georgia, serif;
      --display: 'Playfair Display', Georgia, serif;
      --mono: 'Suisse Intl Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --spring: cubic-bezier(.16, 1, .3, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background:
        radial-gradient(120% 90% at 70% 20%, rgba(var(--champagne-rgb), .05) 0%, transparent 55%),
        radial-gradient(100% 80% at 15% 85%, rgba(var(--champagne-rgb), .03) 0%, transparent 50%),
        var(--obsidian);
      color: var(--bone);
      font-family: var(--serif);
      overflow: hidden;
    }
    .tag {
      position: fixed; top: 1.4rem; left: 1.6rem; z-index: 10;
      font-family: var(--mono); font-size: .55rem; letter-spacing: .34em;
      text-transform: uppercase; color: var(--champagne); opacity: .5;
    }
    .hint {
      position: fixed; bottom: 1.3rem; left: 0; right: 0; z-index: 10;
      text-align: center; font-family: var(--mono); font-size: .55rem;
      letter-spacing: .3em; text-transform: uppercase;
      color: var(--ink-secondary); opacity: .55;
    }
    /* ─── stage ─── */
    .stage {
      position: fixed; inset: 0;
      display: grid; place-items: center;
      perspective: 1200px;
      cursor: crosshair;
    }
    .scene {
      position: relative;
      width: min(1060px, 92vw);
      height: min(600px, 74svh);
      transform-style: preserve-3d;
      will-change: transform;
    }
    .layer {
      position: absolute; inset: 0;
      transform-style: preserve-3d;
      pointer-events: none;
    }
    /* floor shadow grounding the glass */
    .scene::after {
      content: ''; position: absolute; left: 6%; right: 6%; bottom: -84px; height: 110px;
      background: radial-gradient(50% 50% at 50% 50%, rgba(0, 0, 0, .6) 0%, transparent 72%);
      transform: translateZ(-130px);
    }
    /* ─── words UNDER the glass ─── */
    .under span {
      position: absolute; left: var(--ux); top: var(--uy);
      font-family: var(--mono); font-weight: 300;
      font-size: var(--fs, 1.5rem); letter-spacing: .48em; white-space: nowrap;
      color: var(--champagne);
      opacity: 0; filter: blur(2.3px);
      transform: translate3d(calc(var(--mx, 0) * var(--pd, .6) * -26px),
                             calc(var(--my, 0) * var(--pd, .6) * -17px), -90px);
      transition: opacity 1.6s var(--spring) .5s;
    }
    body.loaded .under span { opacity: var(--uo, .13); }
    /* ─── the glass sheet ─── */
    .glass {
      position: absolute; inset: 0;
      border-radius: 20px;
      background: linear-gradient(115deg,
        rgba(255, 255, 255, .05) 0%, rgba(255, 255, 255, .012) 34%,
        rgba(var(--champagne-rgb), .04) 70%, rgba(255, 255, 255, .02) 100%);
      border: 1px solid rgba(255, 255, 255, .09);
      border-top-color: rgba(255, 255, 255, .17);
      -webkit-backdrop-filter: blur(3px) saturate(1.15);
      backdrop-filter: blur(3px) saturate(1.15);
      box-shadow:
        0 70px 140px -60px rgba(0, 0, 0, .95),
        inset 0 1px 0 rgba(255, 255, 255, .1),
        inset 0 -1px 0 rgba(255, 255, 255, .05);
      transform: translateZ(0);
    }
    .glass::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background:
        linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, .05) 33.6%, transparent 36.4%),
        linear-gradient(115deg, transparent 57%, rgba(255, 255, 255, .035) 62%, transparent 65.4%),
        linear-gradient(295deg, transparent 76%, rgba(255, 255, 255, .028) 81%, transparent 84%);
    }
    .glass::after {
      content: ''; position: absolute; inset: -1px; border-radius: inherit; pointer-events: none;
      mix-blend-mode: screen;
      background: radial-gradient(620px circle at var(--gx, 68%) var(--gy, 30%),
        rgba(226, 207, 160, .11), transparent 58%);
      opacity: 0; transition: opacity .7s var(--spring);
    }
    body.loaded .glass::after { opacity: 1; }
    /* ─── words floating ABOVE the glass ─── */
    .over {
      display: flex; flex-direction: column; justify-content: center;
      padding: 0 clamp(2rem, 7vw, 6rem);
    }
    .motto {
      font-family: var(--display); font-weight: 200;
      font-size: clamp(2.9rem, 7.6vw, 6.2rem);
      line-height: 1.04; letter-spacing: -.03em; color: var(--bone);
    }
    .mword { display: inline-block; margin-right: .22em; }
    .mword .mw {
      display: inline-block;
      opacity: 0; transform: translateY(34px);
      filter: blur(7px) drop-shadow(0 26px 34px rgba(0, 0, 0, .55));
      transition: opacity 1.1s var(--spring) var(--wd, 0s),
                  transform 1.1s var(--spring) var(--wd, 0s),
                  filter 1.1s var(--spring) var(--wd, 0s);
    }
    body.loaded .mword .mw {
      opacity: 1; transform: translateY(0);
      filter: blur(0) drop-shadow(0 26px 34px rgba(0, 0, 0, .55));
      animation: drift var(--bd, 7s) ease-in-out var(--wdB, 1s) infinite alternate;
    }
    @keyframes drift { from { translate: 0 -4px; } to { translate: 0 5px; } }
    .mword.par .mw {
      background: linear-gradient(115deg, var(--champagne-light) 8%, var(--champagne) 55%, var(--champagne-deep) 95%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .mword { transform: translate3d(calc(var(--mx, 0) * var(--pd, .6) * 22px),
                                     calc(var(--my, 0) * var(--pd, .6) * 15px), var(--pz, 70px)); }
    /* small floating chips */
    .chip {
      position: absolute; left: var(--cx); top: var(--cy);
      font-family: var(--mono); font-size: .58rem; letter-spacing: .42em;
      text-transform: uppercase; color: var(--champagne-light);
      padding: .62rem .95rem .62rem 1.15rem;
      border: 0.5px solid rgba(var(--champagne-rgb), .3); border-radius: 2px;
      background: rgba(8, 8, 9, .42);
      box-shadow: 0 18px 40px -18px rgba(0, 0, 0, .8);
      transform: translate3d(calc(var(--mx, 0) * var(--pd, .6) * 22px),
                             calc(var(--my, 0) * var(--pd, .6) * 15px), var(--pz, 76px));
      opacity: 0; transition: opacity 1.2s var(--spring) var(--wd, .8s);
    }
    body.loaded .chip { opacity: 1; }
    /* a thin glass card, also floating */
    .minicard {
      position: absolute; left: var(--cx); top: var(--cy);
      width: 128px; height: 80px; border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, .12);
      background: linear-gradient(135deg, rgba(255, 255, 255, .06) 0%, rgba(255, 255, 255, .01) 70%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), 0 26px 50px -24px rgba(0, 0, 0, .85);
      transform: translate3d(calc(var(--mx, 0) * var(--pd, .6) * 26px),
                             calc(var(--my, 0) * var(--pd, .6) * 18px), var(--pz, 88px)) rotate(-4deg);
      opacity: 0; transition: opacity 1.2s var(--spring) var(--wd, 1s);
    }
    body.loaded .minicard { opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      .mword .mw { animation: none !important; transition: none; opacity: 1; transform: none; filter: none; }
      .under span, .chip, .minicard { transition: none; }
    }
  </style>
</head>
<body>
  <div class="tag">NWA · Glass Depth — Effect Study</div>

  <main class="stage" id="stage">
    <div class="scene" id="scene">
      <div class="layer under" aria-hidden="true">
        <span style="--ux:5%;  --uy:12%; --fs:2.5rem; --pd:.95; --uo:.15">STRUCTURE</span>
        <span style="--ux:44%; --uy:7%;  --fs:1.35rem; --pd:.5">PATIENCE</span>
        <span style="--ux:70%; --uy:16%; --fs:1.8rem; --pd:.75">CONVICTION</span>
        <span style="--ux:12%; --uy:44%; --fs:1.5rem; --pd:.4">DURATION</span>
        <span style="--ux:55%; --uy:40%; --fs:2.9rem; --pd:.85; --uo:.17">CAPITAL</span>
        <span style="--ux:78%; --uy:52%; --fs:1.2rem; --pd:.55">ENFORCEMENT</span>
        <span style="--ux:7%;  --uy:76%; --fs:1.7rem; --pd:.8">GOVERNANCE</span>
        <span style="--ux:40%; --uy:86%; --fs:1.4rem; --pd:.6">MATERIAL</span>
        <span style="--ux:72%; --uy:82%; --fs:2.1rem; --pd:.9">RISK</span>
      </div>

      <div class="glass" aria-hidden="true"></div>

      <div class="layer over">
        <h1 class="motto">
          <span class="mword" style="--pz:70px;  --pd:.5;  --wd:.05s; --wdB:.05s; --bd:7.4s"><span class="mw">Capital</span></span>
          <span class="mword" style="--pz:96px;  --pd:.75; --wd:.16s; --wdB:.16s; --bd:8.6s"><span class="mw">is a</span></span>
          <span class="mword par" style="--pz:122px; --pd:1; --wd:.27s; --wdB:.27s; --bd:6.6s"><span class="mw">material,</span></span>
          <span class="mword" style="--pz:82px;  --pd:.6;  --wd:.38s; --wdB:.38s; --bd:9.2s"><span class="mw">not</span></span>
          <span class="mword" style="--pz:106px; --pd:.85; --wd:.49s; --wdB:.49s; --bd:7.9s"><span class="mw">a fluid.</span></span>
        </h1>
        <div class="chip" style="--cx:12%; --cy:78%; --pz:76px; --pd:.65; --wd:.9s">Structural Patience</div>
        <div class="chip" style="--cx:58%; --cy:84%; --pz:96px; --pd:.9; --wd:1.15s">Licensed UAE · Est. 2019</div>
        <div class="minicard" style="--cx:78%; --cy:18%; --pz:88px; --pd:.8; --wd:1s"></div>
      </div>
    </div>
  </main>

  <div class="hint">Move the cursor across the glass — above it words float, beneath it words stay</div>

  <script>
    (function () {
      'use strict';
      var stage = document.getElementById('stage');
      var scene = document.getElementById('scene');
      if (!stage || !scene) return;
      var PRM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var mx = 0, my = 0, tx = 0, ty = 0, hasPointer = false;

      requestAnimationFrame(function () { document.body.classList.add('loaded'); });

      if (PRM) {
        scene.style.transform = 'rotateX(0deg) rotateY(0deg)';
        scene.style.setProperty('--mx', '0');
        scene.style.setProperty('--my', '0');
        return;
      }
      function frame(t) {
        if (!hasPointer) {
          var s = t * 0.00021;
          tx = Math.sin(s) * 0.55;
          ty = Math.cos(s * 0.8) * 0.45;
        }
        mx += (tx - mx) * 0.055;
        my += (ty - my) * 0.055;
        scene.style.transform = 'rotateX(' + (-my * 1.9).toFixed(3) + 'deg) rotateY(' + (mx * 2.4).toFixed(3) + 'deg)';
        scene.style.setProperty('--mx', mx.toFixed(4));
        scene.style.setProperty('--my', my.toFixed(4));
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
      stage.addEventListener('pointermove', function (e) {
        var r = scene.getBoundingClientRect();
        tx = Math.max(-1.15, Math.min(1.15, ((e.clientX - r.left) / r.width) * 2 - 1));
        ty = Math.max(-1.15, Math.min(1.15, ((e.clientY - r.top) / r.height) * 2 - 1));
        hasPointer = true;
        scene.style.setProperty('--gx', (((e.clientX - r.left) / r.width) * 100).toFixed(1) + '%');
        scene.style.setProperty('--gy', (((e.clientY - r.top) / r.height) * 100).toFixed(1) + '%');
      });
      stage.addEventListener('pointerleave', function () { hasPointer = false; });
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) requestAnimationFrame(frame);
      });
    })();
  </script>
</body>
</html>
