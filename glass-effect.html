<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080809">
  <title>Stereo-Vario — lenticular effect · NWA</title>
  <link rel="stylesheet" href="fonts/nwa-fonts.css">
  <style>
    :root {
      --obsidian: #080809;
      --champagne: #C5A059;
      --champagne-light: #E2CFA0;
      --champagne-deep: #A8853F;
      --champagne-rgb: 197, 160, 89;
      --bone: #EDE9E3;
      --ink-secondary: #6A6A72;
      --serif: 'EB Garamond', Georgia, serif;
      --display: 'Playfair Display', Georgia, serif;
      --mono: 'Suisse Intl Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --spring: cubic-bezier(.16, 1, .3, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background:
        radial-gradient(120% 90% at 50% 12%, rgba(var(--champagne-rgb), .05) 0%, transparent 55%),
        var(--obsidian);
      color: var(--bone);
      font-family: var(--serif);
      overflow: hidden;
    }
    .tag {
      position: fixed; top: 1.4rem; left: 1.6rem; z-index: 10;
      font-family: var(--mono); font-size: .55rem; letter-spacing: .34em;
      text-transform: uppercase; color: var(--champagne); opacity: .5;
    }
    .hint {
      position: fixed; bottom: 1.3rem; left: 0; right: 0; z-index: 10;
      text-align: center; font-family: var(--mono); font-size: .55rem;
      letter-spacing: .3em; text-transform: uppercase;
      color: var(--ink-secondary); opacity: .55; padding: 0 1rem;
    }
    /* ─── lenticular card ─── */
    .stage {
      position: fixed; inset: 0;
      display: grid; place-items: center;
      perspective: 1400px;
      cursor: ew-resize;
    }
    .scene {
      position: relative;
      width: min(1020px, 92vw);
      height: min(580px, 74svh);
      transform-style: preserve-3d;
      will-change: transform;
    }
    /* floor shadow grounding the card */
    .scene::after {
      content: ''; position: absolute; left: 5%; right: 5%; bottom: -70px; height: 100px;
      background: radial-gradient(50% 50% at 50% 50%, rgba(0, 0, 0, .65) 0%, transparent 72%);
      transform: translateZ(-40px) scaleX(calc(1 + var(--ax, 0) * -0.04));
    }
    /* the lens raster: smooth glass with faint vertical ribs */
    .lens {
      position: absolute; inset: 0;
      border-radius: 18px;
      background:
        repeating-linear-gradient(90deg,
          rgba(255, 255, 255, .016) 0px, rgba(255, 255, 255, 0) 3px, rgba(0, 0, 0, .014) 6px),
        linear-gradient(115deg,
          rgba(255, 255, 255, .045) 0%, rgba(255, 255, 255, .008) 38%,
          rgba(var(--champagne-rgb), .03) 72%, rgba(255, 255, 255, .02) 100%);
      border: 1px solid rgba(255, 255, 255, .08);
      border-top-color: rgba(255, 255, 255, .16);
      -webkit-backdrop-filter: blur(2.5px);
      backdrop-filter: blur(2.5px);
      box-shadow:
        0 60px 130px -60px rgba(0, 0, 0, .95),
        inset 0 1px 0 rgba(255, 255, 255, .09);
      transform: translateZ(0);
    }
    .lens::after {
      content: ''; position: absolute; inset: -1px; border-radius: inherit; pointer-events: none;
      mix-blend-mode: screen;
      background: linear-gradient(105deg, transparent 42%,
        rgba(226, 207, 160, .09) 50%, transparent 58%);
      background-size: 300% 100%;
      background-position-x: calc(50% + var(--ax, 0) * 38%);
    }
    /* every moving sheet is a plane; JS shears it by its depth */
    .plane { position: absolute; inset: 0; pointer-events: none; will-change: transform; }

    /* ─── deep background words (under everything) ─── */
    .deep span {
      position: absolute; left: var(--ux); top: var(--uy);
      font-family: var(--mono); font-weight: 300;
      font-size: var(--fs, 1.6rem); letter-spacing: .46em; white-space: nowrap;
      color: var(--champagne); opacity: var(--uo, .08); filter: blur(2.6px);
    }
    /* ─── under-glass words ─── */
    .under span {
      position: absolute; left: var(--ux); top: var(--uy);
      font-family: var(--mono); font-weight: 300;
      font-size: var(--fs, 1.4rem); letter-spacing: .48em; white-space: nowrap;
      color: var(--champagne); opacity: var(--uo, .16); filter: blur(1.5px);
    }
    /* ─── on-glass small marks ─── */
    .mark {
      position: absolute; left: var(--ux); top: var(--uy);
      font-family: var(--mono); font-size: .56rem; letter-spacing: .42em;
      text-transform: uppercase; color: var(--champagne-light);
      border: 0.5px solid rgba(var(--champagne-rgb), .28); border-radius: 2px;
      padding: .58rem .9rem .58rem 1.1rem;
      background: rgba(8, 8, 9, .38);
    }
    /* ─── the vario frame: word that switches ─── */
    .vario-slot {
      position: absolute; left: 0; right: 0; top: 24%;
      display: flex; justify-content: center;
    }
    .vario-word {
      font-family: var(--display); font-weight: 200;
      font-size: clamp(2.8rem, 7.4vw, 6rem);
      line-height: 1; letter-spacing: -.03em; text-align: center;
      min-width: 9ch;
      background: linear-gradient(115deg, var(--champagne-light) 8%, var(--champagne) 55%, var(--champagne-deep) 95%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 24px 30px rgba(0, 0, 0, .55));
      transition: filter .15s linear, opacity .15s linear;
    }
    .scene.swapping .vario-word {
      filter: blur(7px) drop-shadow(0 24px 30px rgba(0, 0, 0, .55));
      opacity: .25;
    }
    .vario-cap {
      position: absolute; left: 0; right: 0; top: calc(24% + clamp(3.4rem, 8.8vw, 7.2rem));
      text-align: center;
      font-family: var(--serif); font-style: italic; font-size: clamp(1rem, 2vw, 1.35rem);
      color: var(--bone-dim, #9AA2B0); opacity: .8;
      transition: opacity .15s linear;
    }
    .scene.swapping .vario-cap { opacity: .15; }
    /* ─── floating above glass: index numerals ─── */
    .floatnum {
      position: absolute; left: var(--ux); top: var(--uy);
      font-family: var(--display); font-weight: 300; font-size: 3.4rem;
      color: var(--bone); opacity: .9;
      filter: drop-shadow(0 18px 22px rgba(0, 0, 0, .6));
    }
    @media (prefers-reduced-motion: reduce) {
      .vario-word, .vario-cap, .lens::after { transition: none; }
    }
  </style>
</head>
<body>
  <div class="tag">NWA · Stereo-Vario — virtual lenticular</div>

  <main class="stage" id="stage">
    <div class="scene" id="scene">

      <!-- frame 0 (left tilt) -->
      <div class="plane deep" data-depth="0.06" aria-hidden="true">
        <span style="--ux:16%; --uy:14%; --fs:2.2rem; --uo:.07">STRUCTURE</span>
        <span style="--ux:64%; --uy:74%; --fs:2.6rem; --uo:.06">CONVICTION</span>
      </div>

      <!-- under-glass words -->
      <div class="plane under" data-depth="0.24" aria-hidden="true">
        <span style="--ux:9%;  --uy:36%; --fs:1.5rem">GOVERNANCE</span>
        <span style="--ux:68%; --uy:22%; --fs:1.2rem">ENFORCEMENT</span>
        <span style="--ux:46%; --uy:82%; --fs:1.6rem">DURATION</span>
      </div>
      <div class="plane under" data-depth="0.4" aria-hidden="true">
        <span style="--ux:12%; --uy:66%; --fs:1.9rem; --uo:.2">RISK</span>
        <span style="--ux:74%; --uy:52%; --fs:1.4rem">EXPOSURE</span>
      </div>

      <!-- lens raster -->
      <div class="lens" data-depth="0.03" aria-hidden="true"></div>

      <!-- on-glass marks -->
      <div class="plane marks" data-depth="0.55">
        <span class="mark" style="--ux:8%;  --uy:12%">Licensed UAE · Est. 2019</span>
        <span class="mark" style="--ux:66%; --uy:84%">AUA $500M+</span>
      </div>

      <!-- above glass: vario frames -->
      <div class="plane vario" data-depth="1">
        <div class="vario-slot">
          <div class="vario-word" id="vword">CAPITAL</div>
        </div>
        <div class="vario-cap" id="vcap">is a material, not a fluid.</div>
        <div class="floatnum" style="--ux:12%; --uy:78%">01</div>
        <div class="floatnum" style="--ux:84%; --uy:16%">19</div>
      </div>

    </div>
  </main>

  <div class="hint">Веди курсор влево-вправо — стерео-сдвиг по глубине + смена кадров, как в линзовом растре</div>

  <script>
    (function () {
      'use strict';
      var stage = document.getElementById('stage');
      var scene = document.getElementById('scene');
      var word = document.getElementById('vword');
      var cap = document.getElementById('vcap');
      if (!stage || !scene) return;
      var PRM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      /* frames of the vario cycle (2–3 frames, classic lenticular) */
      var FRAMES = [
        ['CAPITAL', 'is a material, not a fluid.'],
        ['MATERIAL', 'position where value endures.'],
        ['PATIENCE', 'structural patience compounds.']
      ];
      var frame = 0, pending = -1, swapT = 0;

      var planes = scene.querySelectorAll('.plane');
      var ax = 0, ay = 0, tax = 0, tay = 0, hasPointer = false;

      /* zone widths with hysteresis: |ax|<0.30 center, beyond ±0.38 edges */
      function targetFrame() {
        if (ax > 0.38) return 2;
        if (ax < -0.38) return 0;
        if (Math.abs(ax) < 0.30) return 1;
        return frame;
      }
      function swapTo(f) {
        if (f === frame || pending !== -1) return;
        pending = f;
        scene.classList.add('swapping');
        swapT = setTimeout(function () {
          frame = f;
          word.textContent = FRAMES[f][0];
          cap.textContent = FRAMES[f][1];
          scene.classList.remove('swapping');
          pending = -1;
        }, 160);
      }

      function loop(t) {
        if (!hasPointer && !PRM) {
          /* idle: slow cyclic sweep across all frames */
          tax = Math.sin(t * 0.00042);
          tay = Math.sin(t * 0.00027) * 0.35;
        }
        ax += (tax - ax) * 0.16;
        ay += (tay - ay) * 0.16;
        /* physical card tilt (subtle) */
        scene.style.transform = 'rotateY(' + (ax * 2).toFixed(3) + 'deg) rotateX(' + (-ay * 1.4).toFixed(3) + 'deg)';
        scene.style.setProperty('--ax', ax.toFixed(4));
        /* stereo shear: every plane shifts SAME direction, amplitude = depth */
        for (var i = 0; i < planes.length; i++) {
          var el = planes[i];
          var d = parseFloat(el.dataset.depth || '0.5');
          var x = ax * d * 84;
          var y = ay * d * 30;
          el.style.transform = 'translate3d(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px,' + (d * 46).toFixed(1) + 'px)';
        }
        if (pending === -1) {
          var tf = targetFrame();
          if (tf !== frame) swapTo(tf);
        }
        requestAnimationFrame(loop);
      }

      if (PRM) {
        ax = 0; ay = 0;
        scene.style.transform = 'none';
        for (var i = 0; i < planes.length; i++) {
          var d = parseFloat(planes[i].dataset.depth || '0.5');
          planes[i].style.transform = 'translate3d(0,0,' + (d * 46).toFixed(1) + 'px)';
        }
      } else {
        requestAnimationFrame(loop);
        stage.addEventListener('pointermove', function (e) {
          var r = scene.getBoundingClientRect();
          tax = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width) * 2 - 1));
          tay = Math.max(-1, Math.min(1, ((e.clientY - r.top) / r.height) * 2 - 1));
          hasPointer = true;
        });
        stage.addEventListener('pointerleave', function () { hasPointer = false; });
      }
    })();
  </script>
</body>
</html>
